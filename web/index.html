<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>WESPER in the browser</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%235b5bd6'/><path d='M11 12v8M16 9v14M21 12v8' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>" />
    <!-- Adds the COOP/COEP headers on hosts that can't (GitHub Pages), for WASM threads; a no-op otherwise -->
    <script src="coi-serviceworker.min.js"></script>
    <script>
      // coi-serviceworker reloads the page once its worker is running, but can miss that on a first visit.
      if (window.crossOriginIsolated === false && navigator.serviceWorker)
        navigator.serviceWorker.ready.then(() => navigator.serviceWorker.controller || location.reload());
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
